<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>バージョン情報</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" defer>
        // deferは外部ファイルの場合のみの効果がある
        window.addEventListener("DOMContentLoaded", async ()=>{

            // グローバルからTauriのAPIを取得
            const { getName, getVersion } = window.__TAURI__.app;

            // 値を取り出す
            const appName = await getName();
            const version = await getVersion();

            // 画面へ反映
            document.getElementById("name").textContent = appName;
            document.getElementById("version").textContent
                = `バージョン: ${version}`;
        });
    </script>
</head>
<body>
    <div class="version-page">
        <h2 id="name">アプリ名</h2>
        <p id="version">バージョン: XXXX</p>
        <p>Copyright(c) 2026 Kobayashi Kenji</p>
    </div>
</body>
</html>
