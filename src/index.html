<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>バックアップ設定</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="main.js" type="module" defer></script>
</head>

<!-- 設定を読み込むまでは操作不能 -->
<body inert>

    <!-- ローディングオーバーレイ -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <p>設定を読込中...</p>
    </div>

    <!-- メインコンテンツ -->
    <h2>自動バックアップ設定</h2>

    <div class="margin-bottom">
        <label for="source-path">バックアップ元パス (監視するフォルダ)</label>
        <input type="text" id="source-path" value="読込中">
    </div>

    <div class="margin-bottom">
        <label for="destination-path">バックアップ先パス</label>
        <input type="text" id="destination-path" value="読込中">
    </div>

    <div class="margin-bottom">
        <label for="destination-path">バックアップする拡張子 (スペースまたはカンマ区切り)</label>
        <input type="text" id="extensions" value="読込中">
    </div>

    <div class="margin-bottom">
        <label>
            <input type="checkbox" id="is-notify" />
            デスクトップ通知をする
        </label>
        <label>
            <input type="checkbox" id="is-shown" />
            アプリ起動時にこの画面を開く
        </label>
        <label>
            <input type="checkbox" id="auto-start" />
            アプリ起動時に自動で開始する
        </label>
    </div>

    <div class="center margin-bottom">
        <button id="start-btn" disabled>開始</button>
        <button id="stop-btn" disabled>停止</button>
    </div>

    <div class="bg-dark">ログ</div>
    <div id="log-box" class="log-box"></div>
    
</body>
</html>
