<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Workfile Backupper 設定</title>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js" type="module" defer></script>

    <script>
        // help-tipタグを定義
        //  使用方法: <help-tip text="説明文"></help-tip>
        class HelpTip extends HTMLElement {
            connectedCallback() {
                const text = this.getAttribute('text') || '';
                this.innerHTML = `
                    <div class="help-wrap">
                        <div class="help-mark">?</div>
                        <span class="help-text">${text}</span>
                    </div>
                `;
            }
        }
        customElements.define('help-tip', HelpTip);
    </script>

    <!-- 自作タグ自身を、存在しないかのように扱う (スタイルの通過) -->
    <style>
        help-tip { display: contents; }
    </style>
</head>

<body>
    <!-- ローディングオーバーレイ -->
    <div id="loading-overlay" hidden>
        <div class="spinner"></div>
        <p>設定を読込中...</p>
    </div>

    <!-- メインコンテンツ -->
    <div class="header">設定</div>
    <div class="main">
        <h2>バックアップ</h2>

        <label class="folder" for="source-path">
            バックアップ元
            <help-tip text="このフォルダ内で保存が発生した時に、そのファイルをバックアップ先へコピーします。"></help-tip>

            <!-- 仮値を入れる場合は value="D:\一時作業ファイル" -->
            <input type="text" id="source-path" class="folder-path" placeholder="指定されていません" readonly>
            <button id="source-btn" class="folder-btn">選択</button>
        </label>

        <label class="folder" for="destination-path">
            バックアップ先
            <help-tip text="ここへコピーされるファイルには、名前に日時が付与されます。"></help-tip>
            <input type="text" id="destination-path" class="folder-path" placeholder="指定されていません" readonly>
            <button id="destination-btn" class="folder-btn">選択</button>
        </label>

        <label class="toggle">
            サブフォルダを含める
            <input type="checkbox" id="recursive">
        </label>

        <label class="toggle">
            ファイルの種類を指定する
            <help-tip text="OFFの場合は、全てのファイルがバックアップ対象になります。"></help-tip>
            <input type="checkbox" id="by-extensions">
        </label>
        <input
            type="text" id="extensions" class="extensions"
            placeholder="例: txt jpg pdf  (スペースやカンマで区切ります)"
        >

        <hr>
        <h2>デスクトップ通知</h2>

        <label class="toggle">
            バックアップ情報を通知
            <help-tip text="
                以下の場合に通知します。<br>
                ・開始/停止した時<br>
                ・ファイルをバックアップした時<br>
                ・エラー発生時
            "></help-tip>
            <input type="checkbox" id="is-notify">
        </label>

        <label class="toggle">
            ファイルの未保存を通知
            <help-tip text="バックアップが実行されずに経過した時間を通知します。"></help-tip>
            <input type="checkbox" id="is-notify-unsaved">
        </label>
        <div class="notify-interval-div">
            通知間隔 
            <input type="number" id="notify-interval" min="1" max="9999">
            分
        </div>

        <hr>
        <h2>アプリ起動時</h2>

        <label class="toggle">
            この画面を表示する
            <input type="checkbox" id="is-shown">
        </label>

        <label class="toggle">
            自動で開始する
            <input type="checkbox" id="auto-start">
        </label>

        <div class="button-area">
            <button class="main" id="start-btn" disabled>適用して開始</button>
            <button class="main" id="stop-btn" disabled>停止</button>
        </div>
    </div>

    <div class="header">ログ</div>
    <div class="log-outer">
        <div id="log-box" class="log-inner">

            <!-- テスト用 / JSで生成される部分 
            <div class="log-item info">
                <span class="log-time">00:00:00</span>
                <span class="log-title">バックアップ</span>
                <span class="log-body">test[20240614_121409].txt</span>
            </div>
            -->

        </div>
    </div>
</body>
</html>
