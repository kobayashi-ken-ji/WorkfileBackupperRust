<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Workfile Backupper 設定</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="main.js" type="module" defer></script>
</head>

<!-- 設定を読み込むまでは操作不能 -->
 <body>
<!-- <body inert> -->

    <!-- ローディングオーバーレイ -->
    <!--
    <div id="loading-overlay">
        <div class="spinner"></div>
        <p>設定を読込中...</p>
    </div>
     -->

    <!-- メインコンテンツ -->
    <div class="hedder-div">
        <div class="hedder-app-name">Workfile Backupper</div>
        <div class="hedder-description">
            常駐してフォルダ内を監視し、<br>
            ファイルが上書きされた時にバックアップを行います。<br>
        </div>
    </div>

    <div class="box-title">バックアップ設定</div>
    <div class="box-body">
        <div class="box-inner">
            <label for="source-path">バックアップ元（監視するフォルダ）</label>
            <div class="folder-select-div">
                <input type="text" id="source-path" class="folder-path" placeholder="指定されていません" readonly>
                <button id="source-btn" class="folder-btn">選択</button>
            </div>
        </div>
        <hr>
        <div class="box-inner">
            <label for="destination-path">バックアップ先</label>
            <div class="folder-select-div">
                <input type="text" id="destination-path" class="folder-path" placeholder="指定されていません" readonly>
                <button id="destination-btn" class="folder-btn">選択</button>
            </div>
        </div>
        <hr>
        <div class="box-inner">
            <label>
                <input type="checkbox" id="recursive" />
                サブフォルダを含める
            </label>
        </div>
        <hr>
        <div class="box-inner">
            <label for="file-type" class="bottom-margin">バックアップするファイル</label>
            <div class="file-type-div">
                <select id="file-type" required>
                    <option value="all-files-enabled" selected>全てのファイル</option>
                    <option value="by-extensions">拡張子で指定</option>
                </select>
                <div id="file-type-tip">スペースやカンマで区切ります</div>
            </div>
            <input type="text" id="extensions" placeholder="例: txt jpg mp3">
        </div>
    </div>

    <div class="box-title">デスクトップ通知の設定</div>
    <div class="box-body">
        <div class="box-inner">
            <label class="checkbox">
                <input type="checkbox" id="is-notify" />
                バックアップ関連情報を通知
            </label>
        </div>
        <hr>
        <div class="box-inner">
            <label class="checkbox">
                <input type="checkbox" id="is-notify-unsaved" />
                ファイルの未保存を通知
            </label>
            <div id="notify-interval-div" class="notify-interval-div">
                <input type="number" id="notify-interval" min="1" max="9999">
                <div>分間 ファイルの書込みがなければ通知</div>
            </div>
        </div>
    </div>

    <div class="box-title">アプリ起動時の設定</div>
    <div class="box-body">
        <div class="box-inner">
            <label>
                <input type="checkbox" id="is-shown" />
                起動時にこの画面を開く
            </label>
        </div>
        <hr>
        <div class="box-inner">
            <label>
                <input type="checkbox" id="auto-start" />
                起動時に自動で開始する
            </label>
        </div>
    </div>

    <div class="center">
        <button class="main" id="start-btn" disabled>開始</button>
        <button class="main" id="stop-btn" disabled>停止</button>
    </div>
    <div class="center">
        <div class="save-text">設定を適用します</div>
        <div class="save-text"></div>
    </div>

    <div class="box-title">ログ</div>
    <div class="box-body log-outer">
        <div id="log-box" class="log-box"></div>
    </div>
</body>
</html>
